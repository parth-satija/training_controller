[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "training_controller"
version = "0.1.0"
requires-python = ">=3.9"

[tool.maturin]
# Build the Python extension with PyO3 enabled.
features = ["python", "pyo3/extension-module"]
module-name = "training_controller"
